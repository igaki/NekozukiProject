name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: 設定済みのSpring Bootアプリをテストする
        shell: bash
        run: |
          source scripts/lib/project-config.sh
          APP_DIR="$(project_app_dir docs/project.md)"
          project_app_dir_is_safe "$APP_DIR" || { echo "app_dir が未設定または不正です: $APP_DIR" >&2; exit 1; }
          test -f "$APP_DIR/gradlew" || { echo "Gradle Wrapper がありません: $APP_DIR/gradlew" >&2; exit 1; }
          chmod +x "$APP_DIR/gradlew"
          (cd "$APP_DIR" && ./gradlew test)
