name: 新機能
description: 1人が短いPRで実装する利用者価値
title: "[Feature] "
body:
  - type: textarea
    id: field-1
    attributes:
      label: 機能の概要
      description: できるようになることと、今回しないことを記述する。
    validations:
      required: true
  - type: textarea
    id: field-2
    attributes:
      label: AC（受け入れ基準）
      description: Given / When / Then形式で、観測・テスト可能な受け入れ基準を記述する。
    validations:
      required: true
  - type: textarea
    id: field-3
    attributes:
      label: 関連ファイル・変更境界
      description: 変更予定のファイルと、変更してはいけない範囲を記述する。
  - type: textarea
    id: field-4
    attributes:
      label: 実装計画
      description: 変更予定ファイルと実装順序を記述する。
  - type: textarea
    id: field-5
    attributes:
      label: 変更しないものとリスク
      description: 変更範囲に含めないものと、注意すべきリスクを記述する。
  - type: input
    id: dependencies
    attributes:
      label: 依存するIssue
      description: "例: #12。OpenなIssue番号だけを記載する。草案から登録する場合はスクリプトが検査する。"
