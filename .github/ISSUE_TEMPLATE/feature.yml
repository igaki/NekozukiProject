name: 新機能
description: 1人が短いPRで実装する利用者価値
title: "[Feature] "
body:
  - type: textarea
    id: field-1
    attributes:
      label: 機能の概要
      description: できるようになること、今回しないこと、固有の語の意味を記述する。
    validations:
      required: true
  - type: textarea
    id: field-2
    attributes:
      label: AC（受け入れ基準）
      description: Givenは人がどの画面でどの状態かを文で、Whenは人と具体的な操作、Thenは確認場所と結果を書く。
    validations:
      required: true
  - type: textarea
    id: field-3
    attributes:
      label: 関連ファイル・変更境界
      description: 変更予定のファイルと、変更してはいけない範囲を記述する。
  - type: textarea
    id: field-4
    attributes:
      label: 実装計画
      description: 変更予定ファイルと実装順序を記述する。
  - type: textarea
    id: field-5
    attributes:
      label: 変更しないものとリスク
      description: 変更範囲に含めないものと、注意すべきリスクを記述する。
  - type: input
    id: dependencies
    attributes:
      label: 依存するIssue
      description: "例: #12。OpenなIssue番号だけを記載する。草案から登録する場合はスクリプトが検査する。"
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      description: "選択後、GitHubのMilestone欄にも同じ値を設定する。"
      options:
        - lec06
        - lec07
        - lec08
        - lec09
        - lec10
        - lec11
        - lec12
        - lec13
        - lec14
    validations:
      required: true
