<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ルーム - Nekoselect</title>
</head>

<body>
  <main>
    <h1 th:text="'ルーム ' + ${room.id}"></h1>

    <h2>参加者一覧</h2>
    <ul>
      <li th:each="participant : ${participants}" th:text="${participant}"></li>
    </ul>

    <p>最新の参加者は、ページを再読込すると確認できます。</p>
    <p><a th:href="@{/match-room}">ルーム一覧へ戻る</a></p>
  </main>
</body>

</html>
